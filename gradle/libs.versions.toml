[versions]
kotlin = "1.9.10"
androidx-core = "1.10.1"
androidx-appcompat = "1.6.1"
material = "1.9.0"
constraintlayout = "2.1.4"
firebase-bom = "32.7.3"
lifecycle = "2.6.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }




# Firebase libraries - versions managed by the BoM
google-firebase-analytics-ktx = { module = "com.google.firebase:firebase-analytics-ktx" }
google-firebase-auth-ktx = { module = "com.google.firebase:firebase-auth-ktx" }
google-firebase-firestore-ktx = { module = "com.google.firebase:firebase-firestore-ktx" }

# Firebase BoM
google-firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }

# Lifecycle components
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
[plugins]
android-application = { id = "com.android.application", version = "8.2.0" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version = "1.9.0" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version = "1.5.1" }
dagger-hilt-plugin = { id = "com.google.dagger.hilt.android", version = "2.48" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version = "1.9.0" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version = "1.9.0" }
google-services = { id = "com.google.gms.google-services", version = "4.4.0" }